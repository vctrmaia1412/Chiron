name: chiron

# Pilha completa: banco, cache, armazenamento, API, worker, web e proxy.
# Tudo atrás de uma única origem (o proxy na porta 8080), o que deixa o
# cookie de sessão same-origin e dispensa configuração de CORS em produção.
#
#   docker compose -f infra/compose/docker-compose.yml --env-file .env up -d --build
#
# Nenhuma senha aparece aqui: todas vêm do .env, que não entra no versionamento.

services:
  postgres:
    image: postgres:16-alpine
    container_name: chiron-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiron_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: chiron
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiron_owner -d chiron"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [chiron]

  redis:
    image: redis:7-alpine
    container_name: chiron-cache
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [chiron]

  minio:
    image: minio/minio:latest
    container_name: chiron-storage
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [chiron]

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: chiron-migrate
    restart: "no"
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-homolog}
      DATABASE_URL: postgres://chiron_app:${DATABASE_ROLE_PASSWORD}@postgres:5432/chiron
      DATABASE_MIGRATION_URL: postgres://chiron_owner:${POSTGRES_PASSWORD}@postgres:5432/chiron
      DATABASE_ROLE_PASSWORD: ${DATABASE_ROLE_PASSWORD:?defina DATABASE_ROLE_PASSWORD no .env}
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      COLUMN_ENCRYPTION_KEY: ${COLUMN_ENCRYPTION_KEY:?defina COLUMN_ENCRYPTION_KEY no .env}
      COLUMN_HASH_KEY: ${COLUMN_HASH_KEY:?defina COLUMN_HASH_KEY no .env}
    command: ["node", "dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [chiron]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: chiron-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-homolog}
      PORT: 3333
      HOST: 0.0.0.0
      DATABASE_URL: postgres://chiron_app:${DATABASE_ROLE_PASSWORD}@postgres:5432/chiron
      DATABASE_IAM_URL: postgres://chiron_iam:${DATABASE_ROLE_PASSWORD}@postgres:5432/chiron
      DATABASE_ADMIN_URL: postgres://chiron_admin:${DATABASE_ROLE_PASSWORD}@postgres:5432/chiron
      DATABASE_MIGRATION_URL: postgres://chiron_owner:${POSTGRES_PASSWORD}@postgres:5432/chiron
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-chiron}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      PUBLIC_APP_URL: ${STACK_PUBLIC_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET}
      COLUMN_ENCRYPTION_KEY: ${COLUMN_ENCRYPTION_KEY}
      COLUMN_HASH_KEY: ${COLUMN_HASH_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [chiron]

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: chiron-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-homolog}
      DATABASE_URL: postgres://chiron_app:${DATABASE_ROLE_PASSWORD}@postgres:5432/chiron
      DATABASE_ADMIN_URL: postgres://chiron_admin:${DATABASE_ROLE_PASSWORD}@postgres:5432/chiron
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [chiron]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # Caminho relativo: o navegador fala com o proxy, mesma origem.
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: chiron-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_started
    networks: [chiron]

  proxy:
    image: caddy:2-alpine
    container_name: chiron-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:8080"
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks: [chiron]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  chiron:
    driver: bridge
